name: Bug report
description: Something in Money Scribe does not work as expected
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please do **not** use this form for security vulnerabilities; use the **Security** tab → **Report a vulnerability** instead.

        **Never include real financial data** (amounts, account names, balances, people's names). Use invented numbers that reproduce the problem.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this has not been reported yet.
          required: true
        - label: This report contains no real financial or personal data.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that triggers it, with invented values.
      placeholder: |
        1. Open ...
        2. Enter ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Salary calculator
        - Recurring income and expenses
        - Transactions and purchases
        - Debts
        - Overview and reports
        - Import and export
        - Settings, app lock and appearance
        - Build, CI or dev container
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - Not platform-specific
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: The release (e.g. `v1.0.0`) or the commit you built from.

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: e.g. Pixel 8, Android 16 / Chrome 140 on Windows

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the output as text, not a screenshot. Remove tokens, keys, personal paths and any financial data first.
      render: shell
