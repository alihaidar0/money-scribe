name: Bug report
description: Something in the template's tooling, CI, or dev container is broken
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please do **not** use this form for security vulnerabilities; use the **Security** tab → **Report a vulnerability** instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this has not been reported yet.
          required: true
        - label: The problem is in this repository, not in the base image (those go to `flutter-devcontainer`).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that triggers it.
      placeholder: |
        1. Use this template and open the project in the dev container
        2. Run ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dev container / compose / VS Code
        - GitHub Actions (ci.yml / build.yml / release.yml / labels.yml)
        - Husky / commitlint
        - Dependabot
        - Repository rulesets / settings guide
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: image-tag
    attributes:
      label: Dev image tag
      description: The flutter-devcontainer tag the container runs, e.g. `latest` or `flutter-X.Y.Z.R`.
      placeholder: latest

  - type: dropdown
    id: host-os
    attributes:
      label: Host OS
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the output as text, not a screenshot. Remove tokens, keys and personal paths first.
      render: shell
