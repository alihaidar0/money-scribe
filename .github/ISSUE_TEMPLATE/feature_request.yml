name: Feature request
description: Suggest a new feature or an improvement to Money Scribe
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Money Scribe is an offline-first personal finance tracker: the user's data stays on the device. Proposals that need cloud services, accounts or tracking are out of scope.

        **Never include real financial data** in a proposal; use invented numbers in examples.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this has not been proposed yet.
          required: true
        - label: This proposal contains no real financial or personal data.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Salary calculator
        - Recurring income and expenses
        - Transactions and purchases
        - Debts
        - Overview and reports
        - Import and export
        - Settings, app lock and appearance
        - Build, CI or dev container
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
