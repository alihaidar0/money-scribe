name: Feature request
description: Suggest a new feature or an improvement to Money Scribe
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Money Scribe is a personal finance tracker. A backend with sign-in is planned but not chosen yet, so discuss backend proposals here first. Proposals that add analytics, crash reporting or tracking of users are out of scope for now.

        **Never include real financial data** in a proposal; use invented numbers in examples.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this has not been proposed yet.
          required: true
        - label: This proposal contains no real financial or personal data.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Salary calculator
        - Recurring income and expenses
        - Transactions and purchases
        - Debts
        - Overview and reports
        - Import and export
        - Settings, app lock and appearance
        - Build, CI or dev container
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
