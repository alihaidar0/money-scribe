# .github/workflows/ci.yml
#
# Pull-request validation. The single required status check for branch
# protection is the aggregate job "CI passed" at the bottom of this file.
#
# Repository checks (every tier): source branch, lint (ShellCheck, actionlint,
# zizmor), format, commit messages, Node dependency audit.
#
# The Flutter jobs switch on in tiers, so every job also passes on a checkout
# that has no Flutter project:
#
#   Tier 1  no pubspec.yaml               all Flutter jobs are skipped
#   Tier 2  pubspec.yaml, no lock file    flutter doctor only
#   Tier 3  pubspec.yaml + pubspec.lock   format, analyze, test, audit, doctor
name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Only `develop` (of this repository) may open a pull request into `main`.
  # GitHub rulesets cannot restrict a PR's source branch, so it is enforced here
  # and made mandatory through the aggregate "CI passed" check.
  verify-source-branch:
    name: Verify source branch
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Only develop may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from the develop branch of $BASE_REPO (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Source branch OK: $HEAD_REPO:$HEAD_REF -> main"

  # ── Tier detection ───────────────────────────────────────────────────────
  detect:
    name: Detect project tier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.check.outputs.tier }}
      flutter_version: ${{ steps.flutter-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            docker-compose.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Determine project tier
        id: check
        run: |
          if [[ -f "pubspec.yaml" && -f "pubspec.lock" ]]; then
            echo "tier=3" >> "$GITHUB_OUTPUT"
            echo "Tier 3 — pubspec.yaml and pubspec.lock found: full CI is active"
          elif [[ -f "pubspec.yaml" ]]; then
            echo "tier=2" >> "$GITHUB_OUTPUT"
            echo "Tier 2 — pubspec.yaml found, no lock file: flutter doctor only"
          else
            echo "tier=1" >> "$GITHUB_OUTPUT"
            echo "Tier 1 — no pubspec.yaml: all Flutter checks are skipped"
            echo "Run 'flutter create .' inside the container to initialise the project."
          fi

      # A project pins its Flutter version in pubspec.yaml (environment: flutter:
      # 3.x.y), so CI keeps building with it. Without a pin, the newest stable
      # is used. The value only reaches `with:`, never a shell.
      - name: Read the pinned Flutter version
        id: flutter-version
        run: |
          version=""
          if [[ -f "pubspec.yaml" ]]; then
            version="$(awk '
              /^environment:/ { in_env = 1; next }
              in_env && /^[^[:space:]#]/ { in_env = 0 }
              in_env && /^[[:space:]]+flutter:/ {
                sub(/^[[:space:]]+flutter:[[:space:]]*/, ""); sub(/[[:space:]]*#.*/, ""); gsub(/["'"'"'[:space:]]/, ""); print; exit
              }' pubspec.yaml)"
          fi
          if [[ "$version" =~ ^[0-9]+(\.[0-9x]+){0,2}$ ]]; then
            echo "Flutter pinned to $version in pubspec.yaml"
          else
            version=""
            echo "No exact Flutter pin in pubspec.yaml - using the latest stable"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Nudge (never fail) when a project has not frozen its toolchain yet.
          if [[ -f "pubspec.yaml" ]]; then
            if [[ -z "$version" ]]; then
              echo "::warning title=Flutter is not pinned::Add 'flutter: X.Y.Z' under environment: in pubspec.yaml (scripts/pin-image.sh does it) so CI keeps using that version."
            fi
            if [[ -f "docker-compose.yml" ]] && ! grep -Eq '^[[:space:]]*image:.*@sha256:' docker-compose.yml; then
              echo "::warning title=Dev image is not pinned::Run scripts/pin-image.sh to freeze the dev image in docker-compose.yml."
            fi
          fi

  # ── Repository hygiene ───────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      # Git hooks are POSIX sh without a shebang (Husky 9), so they are checked
      # as sh; everything under scripts/ is bash.
      - name: ShellCheck (scripts and git hooks)
        run: |
          git ls-files -z 'scripts/*.sh' | xargs -0 --no-run-if-empty shellcheck
          git ls-files -z '.husky/*' | xargs -0 --no-run-if-empty shellcheck --shell=sh

      - name: Actionlint (workflows)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # Security linter for the workflows themselves (script injection, unpinned
      # actions, excessive permissions, credential persistence). Findings are
      # printed as annotations; nothing is uploaded to code scanning, so no
      # security-events permission is needed.
      - name: Zizmor (workflow security)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # Mirrors the rules in .editorconfig that tooling can verify reliably.
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The platform folders are written by `flutter create` (some of their files
      # have no final newline), so only the line-ending check covers them; the
      # whitespace and final-newline checks skip them.
      - name: Check line endings, trailing whitespace and final newline
        run: |
          status=0
          generated=(':!android' ':!ios' ':!web' ':!macos' ':!linux' ':!windows')

          crlf=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed" { print $NF }')
          if [ -n "$crlf" ]; then
            echo "::error::CRLF line endings found (LF required):"; echo "$crlf"; status=1
          fi

          trailing=$(git grep -nIE '[[:space:]]+$' -- . ':!*.md' "${generated[@]}" || true)
          if [ -n "$trailing" ]; then
            echo "::error::Trailing whitespace found:"; echo "$trailing"; status=1
          fi

          missing=""
          while IFS= read -r -d '' file; do
            if [ -s "$file" ] && grep -Iq . "$file" && [ "$(tail -c1 "$file" | wc -l)" -eq 0 ]; then
              missing="$missing$file"$'\n'
            fi
          done < <(git ls-files -z -- . "${generated[@]}")
          if [ -n "$missing" ]; then
            echo "::error::Missing final newline:"; printf '%s' "$missing"; status=1
          fi

          exit "$status"

      # The compose entrypoint and the Husky hooks are executed directly, so on
      # Linux and macOS they must carry the executable bit in Git.
      - name: Scripts and hooks are executable in Git
        run: |
          not_executable=$(git ls-files -s scripts .husky | awk '$1 != "100755" { print $4 }')
          if [ -n "$not_executable" ]; then
            echo "::error::Not executable in Git (run: git update-index --chmod=+x <file>):"
            echo "$not_executable"
            exit 1
          fi

  # Every commit of a pull request must follow Conventional Commits. The Husky
  # commit-msg hook enforces the same rule locally; this catches commits made
  # without the hooks (web editor, other machines).
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the commit linter
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint the pull request's commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Audits the Node tooling (Husky, commitlint) that every project inherits. The
  # lock file is the only input, so nothing is installed or executed. High and
  # critical advisories fail the check; lower severities are left to Dependabot.
  node-audit:
    name: Node dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit pnpm-lock.yaml
        run: |
          corepack enable
          pnpm audit --audit-level high

  # ── Flutter project checks (Tier 3 unless noted) ─────────────────────────
  flutter-format:
    name: Flutter format
    needs: detect
    if: >-
      needs.detect.outputs.tier == '3' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      - run: dart format --set-exit-if-changed .

  flutter-analyze:
    name: Flutter analyze
    needs: detect
    if: >-
      needs.detect.outputs.tier == '3' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      # Fails if pubspec.lock does not match pubspec.yaml, so CI never silently
      # resolves different package versions than the ones committed.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos

  flutter-test:
    name: Flutter test
    needs: [detect, flutter-format, flutter-analyze]
    if: >-
      always() &&
      needs.detect.outputs.tier == '3' &&
      needs.flutter-format.result == 'success' &&
      needs.flutter-analyze.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      # Fails if pubspec.lock does not match pubspec.yaml, so CI never silently
      # resolves different package versions than the ones committed.
      - run: flutter pub get --enforce-lockfile

      - name: Run tests with coverage
        run: |
          if [[ -d "test" ]]; then
            flutter test --coverage
          else
            echo "No test/ directory — skipping flutter test"
            echo "Add tests under test/ when you are ready."
          fi

      - name: Upload coverage report
        if: hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  # Scans every resolved package in pubspec.lock against the OSV database.
  # Dart has no built-in audit command, and OSV-Scanner is maintained by Google.
  flutter-audit:
    name: Dependency audit
    needs: detect
    if: >-
      needs.detect.outputs.tier == '3' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan pubspec.lock for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock

  flutter-doctor:
    name: Flutter doctor
    needs: detect
    if: needs.detect.outputs.tier == '2' || needs.detect.outputs.tier == '3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      - run: flutter doctor -v

  # The one check to require in branch protection. It always runs and fails if
  # any job above failed or was cancelled; jobs skipped by design (a Flutter job
  # before its tier, the source-branch check outside pull requests into `main`)
  # count as passed.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - verify-source-branch
      - detect
      - lint
      - format
      - commits
      - node-audit
      - flutter-format
      - flutter-analyze
      - flutter-test
      - flutter-audit
      - flutter-doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::At least one required job did not succeed."; exit 1 ;;
            esac
          done
