# .github/workflows/ci.yml
#
# Pull-request validation. The single required status check for branch
# protection is the aggregate job "CI passed" at the bottom of this file.
#
# Repository checks (every tier): source branch, lint (ShellCheck, actionlint,
# zizmor), format, commit messages, Node dependency audit.
#
# The Flutter jobs switch on in tiers, so every job also passes on a checkout
# that has no Flutter project:
#
#   Tier 1  no pubspec.yaml               all Flutter jobs are skipped
#   Tier 2  pubspec.yaml, no lock file    flutter doctor only
#   Tier 3  pubspec.yaml + pubspec.lock   format, analyze, test, audit, doctor
#
# Tier 3 plus a pinned backend contract (api/openapi.yaml) also checks that the
# generated API client in lib/core/api is current (docs/backend-api.md).
#
# The Flutter jobs only run when a file they read changed (scripts/dart-affecting.sh
# keeps the list, the commit hooks use it too): a pull request into develop that
# changes only documentation, other workflows or scripts skips them, and
# "CI passed" counts a skipped job as passed. A pull request into main (the
# release), a manual run and a pull request this check cannot read always run
# everything. The tests run in three parallel shards, at the same time as format
# and analyze (a failure of either shows up without waiting for the other);
# coverage is collected only when everything runs.
name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Only `develop` (of this repository) may open a pull request into `main`.
  # GitHub rulesets cannot restrict a PR's source branch, so it is enforced here
  # and made mandatory through the aggregate "CI passed" check.
  verify-source-branch:
    name: Verify source branch
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Only develop may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from the develop branch of $BASE_REPO (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Source branch OK: $HEAD_REPO:$HEAD_REF -> main"

  # ── Tier detection ───────────────────────────────────────────────────────
  detect:
    name: Detect project tier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.check.outputs.tier }}
      flutter_version: ${{ steps.flutter-version.outputs.version }}
      api_contract: ${{ steps.api.outputs.present }}
      dart_changed: ${{ steps.changed.outputs.dart_changed }}
    steps:
      # Two commits are enough to see what a pull request changes: its checkout
      # is a merge commit, whose first parent is the base branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            docker-compose.yml
            api/openapi.yaml
            scripts/dart-affecting.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Do the Dart checks need to run? Everything runs unless this is a pull
      # request into develop whose files none of the checks read.
      - name: Detect what changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" || "$BASE_REF" == "main" ]]; then
            echo "dart_changed=true" >> "$GITHUB_OUTPUT"
            echo "Everything runs: this is not a pull request into develop"
            exit 0
          fi
          if ! files="$(git diff --name-only --no-renames HEAD^1 HEAD)"; then
            echo "dart_changed=true" >> "$GITHUB_OUTPUT"
            echo "The changed files could not be read: everything runs"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | bash scripts/dart-affecting.sh; then
            echo "dart_changed=true" >> "$GITHUB_OUTPUT"
            echo "A file the Dart checks read changed: they run"
          else
            echo "dart_changed=false" >> "$GITHUB_OUTPUT"
            echo "No file the Dart checks read changed: format, analyze, tests, audit and the API client check are skipped"
          fi

      - name: Determine project tier
        id: check
        run: |
          if [[ -f "pubspec.yaml" && -f "pubspec.lock" ]]; then
            echo "tier=3" >> "$GITHUB_OUTPUT"
            echo "Tier 3 — pubspec.yaml and pubspec.lock found: full CI is active"
          elif [[ -f "pubspec.yaml" ]]; then
            echo "tier=2" >> "$GITHUB_OUTPUT"
            echo "Tier 2 — pubspec.yaml found, no lock file: flutter doctor only"
          else
            echo "tier=1" >> "$GITHUB_OUTPUT"
            echo "Tier 1 — no pubspec.yaml: all Flutter checks are skipped"
            echo "Run 'flutter create .' inside the container to initialise the project."
          fi

      # A pinned backend contract (scripts/sync-api.sh) switches on the check that
      # the generated API client is current. No contract, no check.
      - name: Detect a pinned API contract
        id: api
        run: |
          if [[ -f "api/openapi.yaml" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "API contract found (api/openapi.yaml): the API client check is active"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No api/openapi.yaml: the API client check is skipped"
          fi

      # A project pins its Flutter version in pubspec.yaml (environment: flutter:
      # 3.x.y), so CI keeps building with it. Without a pin, the newest stable
      # is used. The value only reaches `with:`, never a shell.
      - name: Read the pinned Flutter version
        id: flutter-version
        run: |
          version=""
          if [[ -f "pubspec.yaml" ]]; then
            version="$(awk '
              /^environment:/ { in_env = 1; next }
              in_env && /^[^[:space:]#]/ { in_env = 0 }
              in_env && /^[[:space:]]+flutter:/ {
                sub(/^[[:space:]]+flutter:[[:space:]]*/, ""); sub(/[[:space:]]*#.*/, ""); gsub(/["'"'"'[:space:]]/, ""); print; exit
              }' pubspec.yaml)"
          fi
          if [[ "$version" =~ ^[0-9]+(\.[0-9x]+){0,2}$ ]]; then
            echo "Flutter pinned to $version in pubspec.yaml"
          else
            version=""
            echo "No exact Flutter pin in pubspec.yaml - using the latest stable"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Nudge (never fail) when a project has not frozen its toolchain yet.
          if [[ -f "pubspec.yaml" ]]; then
            if [[ -z "$version" ]]; then
              echo "::warning title=Flutter is not pinned::Add 'flutter: X.Y.Z' under environment: in pubspec.yaml (scripts/pin-image.sh does it) so CI keeps using that version."
            fi
            if [[ -f "docker-compose.yml" ]] && ! grep -Eq '^[[:space:]]*image:.*@sha256:' docker-compose.yml; then
              echo "::warning title=Dev image is not pinned::Run scripts/pin-image.sh to freeze the dev image in docker-compose.yml."
            fi
          fi

  # ── Repository hygiene ───────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      # Git hooks are POSIX sh without a shebang (Husky 9), so they are checked
      # as sh; everything under scripts/ is bash.
      - name: ShellCheck (scripts and git hooks)
        run: |
          git ls-files -z 'scripts/*.sh' | xargs -0 --no-run-if-empty shellcheck
          git ls-files -z '.husky/*' | xargs -0 --no-run-if-empty shellcheck --shell=sh

      - name: Actionlint (workflows)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # Security linter for the workflows themselves (script injection, unpinned
      # actions, excessive permissions, credential persistence). Findings are
      # printed as annotations; nothing is uploaded to code scanning, so no
      # security-events permission is needed.
      - name: Zizmor (workflow security)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # Mirrors the rules in .editorconfig that tooling can verify reliably.
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The platform folders are written by `flutter create` (some of their files
      # have no final newline), so only the line-ending check covers them; the
      # whitespace and final-newline checks skip them. api/openapi.yaml is a
      # verbatim copy of the backend's release asset and must stay byte-identical
      # to it (its attestation is checked against the exact bytes), so it is
      # skipped there too.
      - name: Check line endings, trailing whitespace and final newline
        run: |
          status=0
          generated=(':!android' ':!ios' ':!web' ':!macos' ':!linux' ':!windows' ':!api/openapi.yaml')

          crlf=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed" { print $NF }')
          if [ -n "$crlf" ]; then
            echo "::error::CRLF line endings found (LF required):"; echo "$crlf"; status=1
          fi

          trailing=$(git grep -nIE '[[:space:]]+$' -- . ':!*.md' "${generated[@]}" || true)
          if [ -n "$trailing" ]; then
            echo "::error::Trailing whitespace found:"; echo "$trailing"; status=1
          fi

          missing=""
          while IFS= read -r -d '' file; do
            if [ -s "$file" ] && grep -Iq . "$file" && [ "$(tail -c1 "$file" | wc -l)" -eq 0 ]; then
              missing="$missing$file"$'\n'
            fi
          done < <(git ls-files -z -- . "${generated[@]}")
          if [ -n "$missing" ]; then
            echo "::error::Missing final newline:"; printf '%s' "$missing"; status=1
          fi

          exit "$status"

      # The compose entrypoint and the Husky hooks are executed directly, so on
      # Linux and macOS they must carry the executable bit in Git.
      - name: Scripts and hooks are executable in Git
        run: |
          not_executable=$(git ls-files -s scripts .husky | awk '$1 != "100755" { print $4 }')
          if [ -n "$not_executable" ]; then
            echo "::error::Not executable in Git (run: git update-index --chmod=+x <file>):"
            echo "$not_executable"
            exit 1
          fi

  # Every commit of a pull request must follow Conventional Commits. The Husky
  # commit-msg hook enforces the same rule locally; this catches commits made
  # without the hooks (web editor, other machines).
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the commit linter
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint the pull request's commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Audits the Node tooling (Husky, commitlint) that every project inherits. The
  # lock file is the only input, so nothing is installed or executed. High and
  # critical advisories fail the check; lower severities are left to Dependabot.
  node-audit:
    name: Node dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit pnpm-lock.yaml
        run: |
          corepack enable
          pnpm audit --audit-level high

  # ── Flutter project checks (Tier 3 unless noted) ─────────────────────────
  flutter-format:
    name: Flutter format
    needs: detect
    if: >-
      needs.detect.outputs.tier == '3' &&
      needs.detect.outputs.dart_changed == 'true' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      - run: dart format --set-exit-if-changed .

  flutter-analyze:
    name: Flutter analyze
    needs: detect
    if: >-
      needs.detect.outputs.tier == '3' &&
      needs.detect.outputs.dart_changed == 'true' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      # Fails if pubspec.lock does not match pubspec.yaml, so CI never silently
      # resolves different package versions than the ones committed.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos

  # The suite is split over three runners (flutter test --total-shards), which
  # cuts the wall-clock time to a third of the work plus the setup. The shards do
  # not wait for format and analyze: the three checks start together, so the
  # run lasts as long as the slowest of them instead of the sum. Coverage is
  # collected only when everything runs (a pull request into main, a manual
  # run): it is not a gate, and a partial run would only mislead.
  flutter-test:
    name: Flutter test (shard ${{ matrix.shard }} of 3)
    needs: detect
    if: >-
      needs.detect.outputs.tier == '3' &&
      needs.detect.outputs.dart_changed == 'true' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      # Fails if pubspec.lock does not match pubspec.yaml, so CI never silently
      # resolves different package versions than the ones committed.
      - run: flutter pub get --enforce-lockfile

      - name: Run this shard of the tests
        env:
          SHARD: ${{ matrix.shard }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -d "test" ]]; then
            args=(--total-shards=3 "--shard-index=${SHARD}")
            if [[ "$EVENT" != "pull_request" || "$BASE_REF" == "main" ]]; then
              args+=(--coverage)
            fi
            flutter test "${args[@]}"
          else
            echo "No test/ directory — skipping flutter test"
            echo "Add tests under test/ when you are ready."
          fi

      - name: Upload coverage report
        if: hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 7

  # Scans every resolved package in pubspec.lock against the OSV database.
  # Dart has no built-in audit command, and OSV-Scanner is maintained by Google.
  flutter-audit:
    name: Dependency audit
    needs: detect
    if: >-
      needs.detect.outputs.tier == '3' &&
      needs.detect.outputs.dart_changed == 'true' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan pubspec.lock for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock

  # Active only once a backend contract is pinned (api/openapi.yaml, written by
  # scripts/sync-api.sh). The generated client in lib/core/api is committed; this
  # job regenerates it from the contract and fails when the result differs, so the
  # contract and the client can never drift apart unnoticed.
  api-client:
    name: API client is current
    needs: detect
    if: >-
      needs.detect.outputs.tier == '3' &&
      needs.detect.outputs.dart_changed == 'true' &&
      needs.detect.outputs.api_contract == 'true' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      # Fails if pubspec.lock does not match pubspec.yaml, so the generator runs
      # with exactly the package versions that are committed.
      - run: flutter pub get --enforce-lockfile

      - name: Regenerate the API client
        run: bash scripts/generate-api.sh

      # `git status` (not only `git diff`) also reports a generated file that was
      # never committed.
      - name: Fail if lib/core/api differs from the committed client
        run: |
          changes="$(git status --porcelain -- lib/core/api)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff --stat -- lib/core/api
            echo "::error title=API client is out of date::lib/core/api does not match api/openapi.yaml. Run scripts/generate-api.sh (or scripts/sync-api.sh <tag>) and commit the result."
            exit 1
          fi
          echo "lib/core/api matches api/openapi.yaml"

  flutter-doctor:
    name: Flutter doctor
    needs: detect
    if: >-
      (needs.detect.outputs.tier == '2' || needs.detect.outputs.tier == '3') &&
      needs.detect.outputs.dart_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      - run: flutter doctor -v

  # The one check to require in branch protection. It always runs and fails if
  # any job above failed or was cancelled; jobs skipped by design (a Flutter job
  # before its tier, the source-branch check outside pull requests into `main`)
  # count as passed.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - verify-source-branch
      - detect
      - lint
      - format
      - commits
      - node-audit
      - flutter-format
      - flutter-analyze
      - flutter-test
      - flutter-audit
      - api-client
      - flutter-doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::At least one required job did not succeed."; exit 1 ;;
            esac
          done
