# .github/workflows/labels.yml
#
# Keeps the repository's labels identical to .github/labels.yml (labels as code).
# Runs when that file changes on develop (the default branch) or main, which
# includes the first commit of a repository created from the template, so the
# labels exist before the first pull requests. Run it on demand only if they
# are missing.
# Labels not listed in the file are left alone.
name: Labels

on:
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/labels.yml"
  workflow_dispatch:

concurrency:
  group: labels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels to GitHub
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/labels.yml
          persist-credentials: false

      # Plain gh CLI instead of a third-party action: yq, jq and gh are
      # preinstalled on the runner. `gh label create --force` creates a missing
      # label and updates the colour and description of an existing one; labels
      # that are not listed in the file are left alone.
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          count=0
          while IFS= read -r label; do
            name="$(jq -r '.name // ""' <<< "${label}")"
            color="$(jq -r '.color // ""' <<< "${label}")"
            description="$(jq -r '.description // ""' <<< "${label}")"

            if [ -z "${name}" ] || [[ ! "${color}" =~ ^[0-9a-fA-F]{6}$ ]]; then
              echo "::error file=.github/labels.yml::Invalid label entry (needs a name and a 6-digit hex colour): ${label}"
              exit 1
            fi

            gh label create "${name}" --color "${color}" --description "${description}" --force
            count=$((count + 1))
          done < <(yq -o=json -I=0 '.[]' .github/labels.yml)

          if [ "${count}" -eq 0 ]; then
            echo "::error file=.github/labels.yml::No labels found in the file."
            exit 1
          fi
          echo "Synced ${count} labels." >> "$GITHUB_STEP_SUMMARY"
