# .github/workflows/build.yml
#
# Builds the app artifacts (Android APKs, Android App Bundle, Web) for the two
# environments of the branching model (docs/environments.md):
#
#   pull request into develop   staging      test build, debug key
#   pull request into main      production   test build, debug key (the release PR)
#   push to develop             staging      signed build + the rolling "Staging" draft release
#   push to main                production   signed build + the draft release of the version
#   manual run                  staging or production, your choice (signed)
#
# The environment names are also the Android flavors, the GitHub environments and
# the APP_ENV value: every build passes --dart-define=APP_ENV=<environment> (web
# builds have no flavors). Read it in Dart with AppEnvironment.
#
# The address of the server (API_BASE_URL) and the public site key of the
# sign-in bot check (TURNSTILE_SITE_KEY) are variables of the GitHub
# environment, so only the signed Android build, which runs in that environment,
# gets them: the job writes it to .env.<environment> (ignored by Git, never
# printed) and passes the file with --dart-define-from-file. Test builds, the web
# build and the iOS check have no address, so the app keeps its fake data
# (docs/backend-api.md, section 6).
#
# Signing:
#   - Pull request builds are test builds signed with the debug key; they never
#     see a secret. The Android build needs a google-services.json for its flavor
#     (Firebase Cloud Messaging), so test builds get a placeholder with invented
#     values; signed builds write the real file from the environment's secret
#     GOOGLE_SERVICES_JSON_BASE64 (docs/environments.md).
#   - Signed builds (a push, or a manual run) use the key of their GitHub
#     environment (docs/android-signing.md). The `staging` environment is
#     restricted to develop and the `production` one to main, so no other branch
#     can read the keys. Each build is obfuscated and gives one APK per CPU type
#     plus the App Bundle; the job checks the signature of every file. The build
#     number is the run number of this workflow, so it only ever increases.
#   - The files go into a draft GitHub Release: "Staging" (tag staging, replaced
#     by every build on develop, never published) or v<version> from pubspec.yaml
#     (1.4.0+7 -> v1.4.0; a new build of the same version replaces its files; you
#     publish it when it is final). A published release is immutable, so it is
#     left alone (the build warns) and the next release needs a higher version.
#   - The debug symbols of the obfuscated build are kept as a workflow artifact,
#     never in a release, because the repository is public.
#   - The arm64-v8a APK also goes to Firebase App Distribution for the testers
#     (job distribute-firebase; staging keeps only its newest release there).
#
# An unsigned iOS compile check is available as an opt-in job (repository
# variable BUILD_IOS=true). It cannot run until the iOS flavors (Xcode schemes)
# exist, because pubspec.yaml sets a default flavor; iOS signing and App Store
# upload are not set up.
#
# Copied into every generated project, so it skips cleanly until the project has
# a pubspec.yaml and a pubspec.lock; nothing here needs editing in a project.
name: Build

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "ios/**"
      - "web/**"
      - ".github/workflows/build.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "ios/**"
      - "web/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to build for"
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Guard and environment ────────────────────────────────────────────────
  detect:
    name: Detect project
    # Draft pull requests are not built until they are marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      environment: ${{ steps.environment.outputs.environment }}
      flutter_version: ${{ steps.flutter-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check for pubspec.yaml and pubspec.lock
        id: check
        run: |
          if [[ -f "pubspec.yaml" && -f "pubspec.lock" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Project initialised — builds will run"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.yaml / pubspec.lock — skipping all builds"
          fi

      - name: Resolve the build environment
        id: environment
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              if [[ "$BASE_REF" == "main" ]]; then target="production"; else target="staging"; fi ;;
            workflow_dispatch)
              target="$INPUT_ENVIRONMENT" ;;
            *)
              if [[ "$REF_NAME" == "main" ]]; then target="production"; else target="staging"; fi ;;
          esac
          case "$target" in staging|production) ;; *) target="staging" ;; esac
          echo "environment=$target" >> "$GITHUB_OUTPUT"
          echo "Building for: $target"

      # A project pins its Flutter version in pubspec.yaml (environment: flutter:
      # 3.x.y), so CI keeps building with it. Without a pin, the newest stable
      # is used. The value only reaches `with:`, never a shell.
      - name: Read the pinned Flutter version
        id: flutter-version
        run: |
          version=""
          if [[ -f "pubspec.yaml" ]]; then
            version="$(awk '
              /^environment:/ { in_env = 1; next }
              in_env && /^[^[:space:]#]/ { in_env = 0 }
              in_env && /^[[:space:]]+flutter:/ {
                sub(/^[[:space:]]+flutter:[[:space:]]*/, ""); sub(/[[:space:]]*#.*/, ""); gsub(/["'"'"'[:space:]]/, ""); print; exit
              }' pubspec.yaml)"
          fi
          if [[ "$version" =~ ^[0-9]+(\.[0-9x]+){0,2}$ ]]; then
            echo "Flutter pinned to $version in pubspec.yaml"
          else
            version=""
            echo "No exact Flutter pin in pubspec.yaml - using the latest stable"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ── Web ──────────────────────────────────────────────────────────────────
  build-web:
    name: Web (${{ needs.detect.outputs.environment }})
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      # Fails if pubspec.lock does not match pubspec.yaml, so a build never
      # silently resolves different package versions than the ones committed.
      - run: flutter pub get --enforce-lockfile

      - name: Build release
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
        run: |
          args=(--release "--dart-define=APP_ENV=${APP_ENV}")
          flutter build web "${args[@]}"

      - name: Upload Web
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-${{ needs.detect.outputs.environment }}
          path: build/web/
          if-no-files-found: error
          retention-days: ${{ needs.detect.outputs.environment == 'production' && 30 || 14 }}

  # ── Android test builds (debug key) ──────────────────────────────────────
  # Pull requests only. Signed with the debug key, so they are for testing and
  # need no secret. Signed builds run on pushes and manual runs (below).
  build-android-test:
    name: ${{ matrix.name }} (${{ needs.detect.outputs.environment }}, debug key)
    needs: detect
    if: needs.detect.outputs.ready == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android APK
            target: apk
            artifact: android-apk
            path: build/app/outputs/flutter-apk/app-*-release.apk
          - name: Android AAB
            target: appbundle
            artifact: android-aab
            path: build/app/outputs/bundle/*Release/*.aab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      - run: flutter pub get --enforce-lockfile

      # The Google services plugin fails without a google-services.json for the
      # flavor. A test build has no secrets, so it gets a placeholder with invented
      # values (ignored by Git); it reaches no Firebase project.
      - name: Add a placeholder Firebase configuration
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
        run: |
          set -euo pipefail
          application_id="com.alihaidar.moneyscribe"
          if [[ "$APP_ENV" != "production" ]]; then application_id="${application_id}.${APP_ENV}"; fi
          jq -n --arg id "$application_id" '{
            project_info: {
              project_number: "000000000000",
              project_id: "placeholder-project",
              storage_bucket: "placeholder-project.appspot.com"
            },
            client: [{
              client_info: {
                mobilesdk_app_id: "1:000000000000:android:0000000000000000",
                android_client_info: {package_name: $id}
              },
              oauth_client: [],
              api_key: [{current_key: "placeholder-api-key"}],
              services: {appinvite_service: {other_platform_oauth_client: []}}
            }],
            configuration_version: "1"
          }' > "android/app/src/${APP_ENV}/google-services.json"

      - name: Build release
        env:
          TARGET: ${{ matrix.target }}
          APP_ENV: ${{ needs.detect.outputs.environment }}
        run: |
          args=(--release --flavor "$APP_ENV" "--dart-define=APP_ENV=${APP_ENV}")
          flutter build "$TARGET" "${args[@]}"

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ needs.detect.outputs.environment }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  # ── Android signed build ─────────────────────────────────────────────────
  # The only job that reads the signing secrets. It runs in the GitHub
  # environment named after the build environment (staging or production); each
  # environment is restricted to one branch, so a pull request or another branch
  # never gets the keys.
  build-android-signed:
    name: Android signed (${{ needs.detect.outputs.environment }})
    needs: detect
    if: needs.detect.outputs.ready == 'true' && github.event_name != 'pull_request'
    environment: ${{ needs.detect.outputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      - run: flutter pub get --enforce-lockfile

      # Writes the keystore and android/key.<environment>.properties (both ignored
      # by Git) on this one-off runner. They are removed again in the last step.
      - name: Prepare signing
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The ${APP_ENV} environment secret for ${name} is missing (see docs/android-signing.md)."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing-keystore.jks"
          {
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=${RUNNER_TEMP}/signing-keystore.jks"
          } > "android/key.${APP_ENV}.properties"

      # Writes the Firebase configuration of the environment into its flavor
      # folder (ignored by Git; removed in the last step). It must belong to this
      # environment's Android app, so a swapped secret fails the build here.
      - name: Prepare the Firebase configuration
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "::error::The ${APP_ENV} environment secret GOOGLE_SERVICES_JSON_BASE64 is missing (see docs/environments.md)."
            exit 1
          fi
          application_id="com.alihaidar.moneyscribe"
          if [[ "$APP_ENV" != "production" ]]; then application_id="${application_id}.${APP_ENV}"; fi
          target="android/app/src/${APP_ENV}/google-services.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$target"
          if ! jq -e --arg id "$application_id" \
            'any(.client[]; .client_info.android_client_info.package_name == $id)' \
            "$target" > /dev/null; then
            rm -f "$target"
            echo "::error::The ${APP_ENV} secret GOOGLE_SERVICES_JSON_BASE64 is not a google-services.json for ${application_id}."
            exit 1
          fi

      # The address of the server comes from the variable API_BASE_URL of the
      # GitHub environment. It is public once the app is built, but it is kept
      # out of the repository, so it is written here, to a file Git ignores, and
      # never printed. An empty variable means "no server": the app keeps its
      # fake data. Anything but a bare https address stops the build. The
      # Turnstile site key is public once the app is built, but is kept out of
      # the repository the same way; empty means "no bot check", and anything
      # but letters, digits, - and _ stops the build.
      - name: Write the build configuration
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$API_BASE_URL" && ! "$API_BASE_URL" =~ ^https://[^/?#@[:space:]]+$ ]]; then
            echo "::error::The ${APP_ENV} variable API_BASE_URL must be an https address with no path, such as https://api.example.com."
            exit 1
          fi
          if [[ -n "$TURNSTILE_SITE_KEY" && ! "$TURNSTILE_SITE_KEY" =~ ^[0-9A-Za-z_-]{1,64}$ ]]; then
            echo "::error::The ${APP_ENV} variable TURNSTILE_SITE_KEY must be a Cloudflare Turnstile site key."
            exit 1
          fi
          {
            printf 'API_BASE_URL=%s\n' "$API_BASE_URL"
            printf 'TURNSTILE_SITE_KEY=%s\n' "$TURNSTILE_SITE_KEY"
          } > ".env.${APP_ENV}"

      # One APK per CPU type and the App Bundle, obfuscated. The symbol files in
      # build/symbols turn an obfuscated stack trace back into readable names.
      - name: Build signed release
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          args=(--release --flavor "$APP_ENV" "--build-number=${BUILD_NUMBER}" "--dart-define=APP_ENV=${APP_ENV}" "--dart-define-from-file=.env.${APP_ENV}" --obfuscate --split-debug-info=build/symbols)
          flutter build apk --split-per-abi "${args[@]}"
          flutter build appbundle "${args[@]}"

      # Fails the build if a file is signed with the debug key, or, when the
      # environment variable ANDROID_CERT_SHA256 is set, with any other key than
      # the expected one. The fingerprint is public information.
      - name: Verify the signature
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner was not found in the Android build tools."
            exit 1
          fi
          normalise() { tr -d ': \n' | tr 'A-F' 'a-f'; }
          expected="$(printf '%s' "${EXPECTED_SHA256:-}" | normalise)"

          check() { # <file> <owner> <fingerprint>
            if [[ "$2" == *"Android Debug"* ]]; then
              echo "::error::$1 is signed with the debug key."
              exit 1
            fi
            if [[ -n "$expected" && "$3" != "$expected" ]]; then
              echo "::error::$1 is signed with an unexpected key (SHA-256 ${3})."
              exit 1
            fi
            echo "$1: signed by ${3}"
            echo "- \`$1\`: SHA-256 \`${3}\`" >> "$GITHUB_STEP_SUMMARY"
          }

          mapfile -t apks < <(find build/app/outputs/flutter-apk -name 'app-*-release.apk' | sort)
          if [[ "${#apks[@]}" -ne 3 ]]; then
            echo "::error::Expected 3 APKs (one per CPU type), found ${#apks[@]}."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            out="$("$apksigner" verify --print-certs "$apk")"
            owner="$(grep -m1 'certificate DN:' <<< "$out")"
            fingerprint="$(grep -m1 'certificate SHA-256 digest:' <<< "$out" | awk '{print $NF}' | normalise)"
            check "$apk" "$owner" "$fingerprint"
          done

          mapfile -t aabs < <(find build/app/outputs/bundle -name '*.aab')
          if [[ "${#aabs[@]}" -ne 1 ]]; then
            echo "::error::Expected 1 App Bundle, found ${#aabs[@]}."
            exit 1
          fi
          out="$(keytool -printcert -jarfile "${aabs[0]}")"
          owner="$(grep -m1 'Owner:' <<< "$out")"
          fingerprint="$(grep -m1 'SHA256:' <<< "$out" | awk '{print $NF}' | normalise)"
          check "${aabs[0]}" "$owner" "$fingerprint"

          if [[ -z "$expected" ]]; then
            echo "::notice::Set the environment variable ANDROID_CERT_SHA256 to the fingerprint above so every build is checked against it."
          fi

      # Re-use the version of pubspec.yaml in the file names. The draft release
      # replaces all its old files, so the names can carry the version.
      - name: Collect the release files
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
        run: |
          set -euo pipefail
          full="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          version="${full%%+*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::pubspec.yaml needs a semantic 'version:' such as 1.0.0+1 (found '${full:-none}')."
            exit 1
          fi
          prefix="money-scribe-${version}"
          if [[ "$APP_ENV" != "production" ]]; then prefix="money-scribe-${APP_ENV}-${version}"; fi
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$(find build/app/outputs/flutter-apk -name "app-*${abi}*-release.apk" | head -n 1)"
            if [[ -z "$apk" ]]; then
              echo "::error::No APK found for ${abi}."
              exit 1
            fi
            cp "$apk" "dist/${prefix}-${abi}.apk"
          done
          aab="$(find build/app/outputs/bundle -name '*.aab' | head -n 1)"
          cp "$aab" "dist/${prefix}.aab"
          (cd dist && sha256sum -- * > SHA256SUMS.txt)

      - name: Upload the signed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-signed-${{ needs.detect.outputs.environment }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-symbols-${{ needs.detect.outputs.environment }}
          path: |
            build/symbols/
            build/app/outputs/mapping/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove the signing files
        if: always()
        run: rm -f android/key.*.properties "$RUNNER_TEMP/signing-keystore.jks" android/app/src/*/google-services.json

  # ── Firebase App Distribution ────────────────────────────────────────────
  # Sends the arm64-v8a APK of the signed build to the testers' group of the
  # environment's Firebase project, so a tester opens one invitation link and
  # installs from there. Nothing of Firebase is in the app. The job has no
  # access to the signing secrets: it signs in to Google Cloud with the OIDC
  # token of the run (Workload Identity Federation, no stored key) and acts as a
  # service account that has the role Firebase App Distribution Admin only. The
  # trust is limited to this repository and to the GitHub environment, which is
  # restricted to one branch (docs/environments.md). Staging keeps only its
  # newest release in App Distribution; production keeps its history (Firebase
  # removes a release after 150 days).
  #
  # It does nothing, and the build still passes, until the three variables of the
  # GitHub environment are set: FIREBASE_APP_ID, GCP_WORKLOAD_IDENTITY_PROVIDER
  # and GCP_SERVICE_ACCOUNT. None of them is a secret.
  distribute-firebase:
    name: Firebase App Distribution (${{ needs.detect.outputs.environment }})
    needs: [detect, build-android-signed]
    if: needs.detect.outputs.ready == 'true' && github.event_name != 'pull_request'
    environment: ${{ needs.detect.outputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Skips the job quietly while Firebase App Distribution is not set up for
      # this environment, and stops it on a value of the wrong shape.
      - name: Check the configuration
        id: config
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
          APP_ID: ${{ vars.FIREBASE_APP_ID }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_ID" && -z "$PROVIDER" && -z "$SERVICE_ACCOUNT" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase App Distribution is not set up for ${APP_ENV}; skipped (docs/environments.md)."
            exit 0
          fi
          if [[ ! "$APP_ID" =~ ^1:([0-9]+):android:[0-9a-f]+$ ]]; then
            echo "::error::The ${APP_ENV} variable FIREBASE_APP_ID must be the Android app ID from the Firebase console, such as 1:123456789012:android:0123456789abcdef."
            exit 1
          fi
          if [[ ! "$PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9-]+/providers/[A-Za-z0-9-]+$ ]]; then
            echo "::error::The ${APP_ENV} variable GCP_WORKLOAD_IDENTITY_PROVIDER must be the full name of the workload identity provider."
            exit 1
          fi
          if [[ ! "$SERVICE_ACCOUNT" =~ ^[A-Za-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::The ${APP_ENV} variable GCP_SERVICE_ACCOUNT must be the email address of the service account."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "project_number=$(cut -d: -f2 <<< "$APP_ID")" >> "$GITHUB_OUTPUT"

      - name: Download the signed files
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-signed-${{ needs.detect.outputs.environment }}
          path: dist

      - name: Sign in to Google Cloud
        id: auth
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      # Uploads the APK, waits for Firebase to process it, writes the release
      # notes and sends the release to the testers' group. On staging it then
      # deletes every other release of the app. The new release is looked up in
      # the list first, and nothing is deleted unless it is there.
      - name: Upload and distribute
        if: steps.config.outputs.enabled == 'true'
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
          APP_ID: ${{ vars.FIREBASE_APP_ID }}
          PROJECT_NUMBER: ${{ steps.config.outputs.project_number }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          TESTER_GROUP: testers
        run: |
          set -euo pipefail
          api="https://firebaseappdistribution.googleapis.com"
          app="projects/${PROJECT_NUMBER}/apps/${APP_ID}"
          call() { curl --fail-with-body --silent --show-error --retry 3 -H "Authorization: Bearer ${ACCESS_TOKEN}" "$@"; }

          mapfile -t apks < <(find dist -name '*-arm64-v8a.apk')
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected 1 arm64-v8a APK in the signed files, found ${#apks[@]}."
            exit 1
          fi
          apk="${apks[0]}"
          full="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          version="${full%%+*}"

          operation="$(call -X POST "${api}/upload/v1/${app}/releases:upload" \
            -H "X-Goog-Upload-Protocol: raw" \
            -H "X-Goog-Upload-File-Name: $(basename "$apk")" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${apk}" | jq -r '.name')"

          result=""
          for _ in $(seq 1 36); do
            result="$(call "${api}/v1/${operation}")"
            if [[ "$(jq -r '.done // false' <<< "$result")" == "true" ]]; then break; fi
            sleep 5
          done
          if [[ "$(jq -r '.done // false' <<< "$result")" != "true" ]]; then
            echo "::error::Firebase did not finish processing the upload in 3 minutes."
            exit 1
          fi
          if [[ "$(jq -r 'has("error")' <<< "$result")" == "true" ]]; then
            echo "::error::Firebase rejected the upload: $(jq -r '.error.message // "unknown error"' <<< "$result")"
            exit 1
          fi
          release="$(jq -r '.response.release.name // empty' <<< "$result")"
          outcome="$(jq -r '.response.result // "unknown"' <<< "$result")"
          if [[ -z "$release" ]]; then
            echo "::error::The upload answer has no release name."
            exit 1
          fi

          notes="Build ${BUILD_NUMBER} of version ${version} (${APP_ENV}), built from commit ${COMMIT_SHA:0:7}."
          call -X PATCH "${api}/v1/${release}?updateMask=releaseNotes.text" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$notes" '{releaseNotes: {text: $text}}')" > /dev/null
          call -X POST "${api}/v1/${release}:distribute" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg group "$TESTER_GROUP" '{groupAliases: [$group]}')" > /dev/null
          echo "Build ${BUILD_NUMBER} sent to the group ${TESTER_GROUP} of Firebase App Distribution (${outcome})." >> "$GITHUB_STEP_SUMMARY"

          if [[ "$APP_ENV" != "staging" ]]; then
            exit 0
          fi

          keep="${release##*/}"
          old=()
          seen=false
          page=""
          while :; do
            query=(--data-urlencode "pageSize=100")
            if [[ -n "$page" ]]; then query+=(--data-urlencode "pageToken=${page}"); fi
            list="$(call -G "${api}/v1/${app}/releases" "${query[@]}")"
            if [[ "$(jq -r --arg keep "$keep" '[.releases[]? | select((.name | split("/") | last) == $keep)] | length' <<< "$list")" -gt 0 ]]; then
              seen=true
            fi
            while IFS= read -r name; do
              old+=("$name")
            done < <(jq -r --arg keep "$keep" '.releases[]? | select((.name | split("/") | last) != $keep) | .name' <<< "$list")
            page="$(jq -r '.nextPageToken // empty' <<< "$list")"
            if [[ -z "$page" ]]; then break; fi
          done
          if [[ "$seen" != "true" ]]; then
            echo "::warning::The new release was not found in the list, so the older releases were kept."
            exit 0
          fi
          for ((i = 0; i < ${#old[@]}; i += 100)); do
            printf '%s\n' "${old[@]:i:100}" \
              | jq -R . | jq -s '{names: .}' \
              | call -X POST "${api}/v1/${app}/releases:batchDelete" \
                  -H "Content-Type: application/json" --data-binary @- > /dev/null
          done
          echo "Removed ${#old[@]} older release(s) from Firebase App Distribution; only build ${BUILD_NUMBER} is kept." >> "$GITHUB_STEP_SUMMARY"

  # ── Draft GitHub Release ─────────────────────────────────────────────────
  # Staging: the single draft "Staging" (tag staging), refreshed by every build on
  # develop and never published. Production: the draft v<version>. Either way it
  # gets the signed APKs, the App Bundle, the checksums and the web build. This job
  # has no access to the signing secrets. Publishing the production draft is a
  # manual click on the Releases page; a published release is immutable and is
  # never touched here.
  release-draft:
    name: Draft GitHub Release (${{ needs.detect.outputs.environment }})
    needs: [detect, build-web, build-android-signed]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the signed files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-signed-${{ needs.detect.outputs.environment }}
          path: dist

      - name: Download the web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build-${{ needs.detect.outputs.environment }}
          path: web-build

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          APP_ENV: ${{ needs.detect.outputs.environment }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          full="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          version="${full%%+*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::pubspec.yaml needs a semantic 'version:' such as 1.0.0+1 (found '${full:-none}')."
            exit 1
          fi

          prefix="money-scribe-${version}"
          if [[ "$APP_ENV" != "production" ]]; then prefix="money-scribe-${APP_ENV}-${version}"; fi
          (cd web-build && zip -qr "../dist/${prefix}-web.zip" .)

          if [[ "$APP_ENV" == "production" ]]; then
            tag="v${version}"
            title="$tag"
            prerelease=false
            if [[ "$version" == *-* ]]; then prerelease=true; fi
            generated="$(gh api -X POST "repos/${GH_REPO}/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$TARGET_SHA" --jq .body)"
            body="$(printf 'Build %s of version %s, built from commit %s.\n\n%s\n' \
              "$BUILD_NUMBER" "$version" "$TARGET_SHA" "$generated")"
          else
            tag="staging"
            title="Staging"
            prerelease=true
            body="$(printf 'Staging build %s of version %s, built from commit %s on the develop branch.\n\nEvery merge into develop replaces the files of this draft. Do not publish it.\n' \
              "$BUILD_NUMBER" "$version" "$TARGET_SHA")"
          fi

          # A draft has no real Git tag yet, and GitHub renames its tag (to
          # untagged-...) once the draft has been updated, so a draft is found by
          # its tag or else by its title; a published release by its tag. The
          # newest match comes first. `sed` (not `head`) reads the whole list, so
          # an early exit can never break the pipe.
          matches="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            | jq -r --arg tag "$tag" --arg title "$title" \
              '.[] | select(.tag_name == $tag or (.draft and .name == $title)) | "\(.id) \(.draft)"')"
          existing="$(printf '%s\n' "$matches" | sed -n 1p)"
          count="$(printf '%s\n' "$matches" | grep -c . || true)"
          if [[ "$count" -gt 1 ]]; then
            echo "::warning::${count} releases match ${title}; the newest is used. Delete the others on the Releases page."
          fi

          if [[ -z "$existing" ]]; then
            id="$(gh api -X POST "repos/${GH_REPO}/releases" \
              -f tag_name="$tag" -f target_commitish="$TARGET_SHA" -f name="$title" \
              -f body="$body" -F draft=true -F prerelease="$prerelease" --jq .id)"
            action="created"
          else
            id="${existing% *}"
            if [[ "${existing#* }" != "true" ]]; then
              echo "::warning::Release ${tag} is already published and cannot be changed. For production, raise the version in pubspec.yaml to build a new release; the signed files of this build are in the workflow artifacts."
              echo "Release ${tag} is already published; its files were not replaced." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Sending the tag again keeps the draft under it.
            reported="$(gh api -X PATCH "repos/${GH_REPO}/releases/${id}" \
              -f tag_name="$tag" -f target_commitish="$TARGET_SHA" -f body="$body" \
              -F prerelease="$prerelease" --jq .tag_name)"
            if [[ "$reported" != "$tag" ]]; then
              echo "::notice::GitHub now lists this draft under the tag ${reported}; it is found again by its title."
            fi
            # Replace the files: remove the old ones, then upload the new ones.
            for asset in $(gh api --paginate "repos/${GH_REPO}/releases/${id}/assets" --jq '.[].id'); do
              gh api -X DELETE "repos/${GH_REPO}/releases/assets/${asset}"
            done
            action="refreshed"
          fi

          for file in dist/*; do
            gh api -X POST \
              "https://uploads.github.com/repos/${GH_REPO}/releases/${id}/assets?name=$(basename "$file")" \
              -H "Content-Type: application/octet-stream" --input "$file" > /dev/null
          done

          echo "Draft release ${title} ${action} (release ${id}, build ${BUILD_NUMBER}). The production draft is published from the Releases page when the version is final." >> "$GITHUB_STEP_SUMMARY"

  # ── iOS (opt-in) ─────────────────────────────────────────────────────────
  # Needs the iOS flavors (Xcode schemes named staging and production) first,
  # because pubspec.yaml sets a default flavor; add them with the iOS work.
  # An unsigned compile check of the iOS app on a macOS runner. macOS minutes
  # cost more than Linux ones on private repositories, so it is off until you
  # set the repository variable BUILD_IOS to "true" (Settings → Secrets and
  # variables → Actions → Variables). The result is not installable: signing
  # and App Store upload are added per project.
  build-ios:
    name: iOS (${{ needs.detect.outputs.environment }})
    needs: detect
    if: needs.detect.outputs.ready == 'true' && vars.BUILD_IOS == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.detect.outputs.flutter_version }}

      - run: flutter pub get --enforce-lockfile

      - name: Build iOS (no code signing)
        env:
          APP_ENV: ${{ needs.detect.outputs.environment }}
        run: |
          args=(--release --no-codesign "--dart-define=APP_ENV=${APP_ENV}")
          flutter build ios "${args[@]}"

      - name: Upload iOS build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-app-${{ needs.detect.outputs.environment }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: ${{ needs.detect.outputs.environment == 'production' && 30 || 14 }}
