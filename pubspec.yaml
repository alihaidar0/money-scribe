name: money_scribe
description: "Money Scribe: Budget & Expense Tracker"
publish_to: 'none'
version: 0.1.0+1

environment:
  flutter: 3.47.7
  sdk: ^3.13.5

dependencies:
  archive: 4.5.2
  biometric_signature: 13.3.0
  bloc: 9.2.1
  bloc_concurrency: 0.3.0
  crypto: 3.0.7
  device_info_plus: 13.3.0
  dio: 5.11.1
  equatable: 3.0.0
  file_selector: 1.1.0
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_timezone: 5.1.1
  go_router: 18.1.1
  intl: 0.20.3
  json_annotation: 4.12.0
  local_auth: 3.0.2
  meta: 1.19.0
  package_info_plus: 10.2.2
  path_provider: 2.1.6
  retrofit: 4.10.0
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  webview_flutter: 4.14.1

dev_dependencies:
  bloc_test: 10.0.0
  build_runner: 2.16.1
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  json_serializable: 6.15.2
  retrofit_generator: 10.3.2
  shared_preferences_platform_interface: 2.4.2
  swagger_parser: 1.45.0
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  # Generates the localization code from `l10n.yaml` (see `lib/core/l10n/`).
  generate: true
  # The flavor used when none is given: `flutter run` starts the staging app.
  # See docs/environments.md.
  default-flavor: staging

  assets:
    # The app icon, shown on the Welcome screen.
    - assets/icon/ios_icon_1024.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
