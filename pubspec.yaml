name: money_scribe
description: "Money Scribe: Budget & Expense Tracker"
publish_to: 'none'
version: 0.1.0+1

environment:
  flutter: 3.47.6
  sdk: ^3.13.5

dependencies:
  bloc: 9.2.1
  bloc_concurrency: 0.3.0
  equatable: 3.0.0
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: 18.0.2
  intl: 0.20.3
  shared_preferences: 2.5.6

dev_dependencies:
  bloc_test: 10.0.0
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: 2.4.2
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  # Generates the localization code from `l10n.yaml` (see `lib/core/l10n/`).
  generate: true
  # The flavor used when none is given: `flutter run` starts the staging app.
  # See docs/environments.md.
  default-flavor: staging

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
