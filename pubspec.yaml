name: money_scribe
description: "Money Scribe: Budget & Expense Tracker"
publish_to: 'none'
version: 0.1.0+1

environment:
  flutter: 3.47.6
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  intl: 0.20.3
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: 2.4.2
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  # Generates the localization code from `l10n.yaml` (see `lib/core/l10n/`).
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
